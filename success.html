<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fbf6ee" />
  <title>RSVP recibido | Isabela & Benjamin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      color: #1b1712;
      font-family: "Inter", system-ui, sans-serif;
      background:
        radial-gradient(circle at 50% 20%, rgba(211, 183, 115, .28), transparent 28rem),
        linear-gradient(180deg, #fffdf9, #fbf6ee);
    }

    main {
      width: min(100%, 720px);
      padding: clamp(34px, 7vw, 72px);
      border: 1px solid rgba(116, 88, 47, .2);
      background: rgba(255, 253, 248, .78);
      box-shadow: 0 26px 70px rgba(78, 54, 28, .16);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(3.4rem, 10vw, 7rem);
      font-weight: 300;
      line-height: .9;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    p {
      max-width: 520px;
      margin: 22px auto 0;
      color: #75695d;
      line-height: 1.8;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      margin-top: 28px;
      padding: 0 20px;
      border: 1px solid #1b1712;
      border-radius: 999px;
      background: #1b1712;
      color: #fffdf8;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .16em;
      text-decoration: none;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <h1>Gracias</h1>
    <p>Tu RSVP fue enviado correctamente. Isabela & Benjamin están felices de compartir este momento contigo.</p>
    <a href="/#inicio">Volver a la invitación</a>
  </main>
</body>
</html>
